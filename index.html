<!DOCTYPE html>
<html>
  <head>
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
    <h1>TaskFlow</h1>
  </header>
    <main>
      <div class="conteudo-principal">
        <div class="area-tarefas">
    <section>
      <h2>Adicionar uma nova tarefa</h2>
      <form>
      <label for="tarefa">Tarefa</label>
      <input type="text" id="tarefa" placeholder="Digite uma tarefa">
        <label for="dataTarefa">Data</label>
        <input type="date" id="dataTarefa">
      <button type="button" id="adicionar">Adicionar</button>
      </form>
  </section>
    <section>
      <h2>Minhas tarefas</h2>
    <ul id="listaTarefas">
    </ul> 
    </section>
        </div>
        <section class="calendario">
          <h2>Calendário</h2>
          <button type="button" id="proximoMes">Próximo mês</button>
          <div id="calendario">
          </div>
          <div id="detalhesDia">
          </div>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
    <h1>TaskFlow</h1>
  </header>
    <main>
      <div class="conteudo-principal">
    <section>
      <h2>Adicionar uma nova tarefa</h2>
      <form>
      <label for="tarefa">Tarefa</label>
      <input type="text" id="tarefa" placeholder="Digite uma tarefa">
      <button type="button" id="adicionar">Adicionar</button>
      </form>
  </section>
    <section>
      <h2>Minhas tarefas</h2>
    <ul id="listaTarefas">
      <li>Estudar Python</li>
      <li>Ir para academia</li>
      <li>Preparar meu discurso</li>
      <li>Jogar bola</li>
    </ul> 
    </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
